server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    sendfile off;

    location / {
        try_files $uri $uri/ /index.html;
        
        # Required for WebAssembly SharedArrayBuffer (Multithreading)
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # Static assets should return 404 if missing, not fallback to index.html
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|data)$ {
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # Ensure correct MIME type for WebAssembly
    location ~ \.wasm$ {
        types {
            application/wasm wasm;
        }
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # Proxy to Node.js Tablebase server
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
